name: Build boot image

# Builds the kernel and a Nura (postmarketOS) boot.img for the Xiaomi Mi 10 on a
# native arm64 GitHub runner. Download the result from the run's "Artifacts"
# and start it with:  fastboot boot boot.img   (RAM boot, nothing is flashed)
#
# With "full_image" the run also produces xiaomi-umi.img, the whole system,
# for:  fastboot flash userdata xiaomi-umi.img   (ERASES Android user data)

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "UI to install (console, phosh, plasma-mobile, ...)"
        default: console
      full_image:
        description: "Also build the full system image (xiaomi-umi.img)"
        type: boolean
        default: false
      debug_shell:
        description: "Stop in the initramfs debug shell (telnet 172.16.42.1)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "pmaports/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      DEVICE: xiaomi-umi
      UI: ${{ inputs.ui || 'console' }}
      DEBUG_SHELL: ${{ github.event_name == 'push' || inputs.debug_shell }}
      FULL_IMAGE: ${{ inputs.full_image || false }}
      # Login and lock-screen password. Set the UMI_PASSWORD repository secret
      # to use your own; otherwise change it with passwd after the first boot.
      PASSWORD: ${{ secrets.UMI_PASSWORD || '147147' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pmbootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git kpartx openssl python3
          git clone --depth 1 https://gitlab.nura.eco/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          git -C "$HOME/pmbootstrap" log -1 --format='pmbootstrap %h %ad'
          mkdir -p "$HOME/.local/bin"
          ln -s "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          nproc; free -g | sed -n 2p; df -h / | tail -1

      # The kernel takes over an hour to build. Keep the built package, and the
      # throwaway key it was signed with, until the kernel sources change.
      - name: Restore cached kernel package
        uses: actions/cache@v4
        with:
          path: ~/kernel-cache
          key: kernel-${{ hashFiles('pmaports/device/testing/linux-xiaomi-umi/**') }}

      # Compiler cache: when the kernel does have to be rebuilt after a small
      # change, only the changed files are compiled again.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/var/pmbootstrap/cache_ccache_aarch64
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Initialise pmbootstrap and add the umi packages
        run: |
          # "yes" is killed by SIGPIPE once init is done; that is not a failure
          set +o pipefail
          yes '' | pmbootstrap --details-to-stdout init --shallow-initial-clone
          set -o pipefail
          APORTS="$(pmbootstrap config aports)"
          git -C "$APORTS" log -1 --format='pmaports %h %ad'
          cp -r pmaports/device/testing/* "$APORTS/device/testing/"
          pmbootstrap config device "$DEVICE"
          pmbootstrap config ui "$UI"

          if [ "$DEBUG_SHELL" = "true" ]; then
            # stop in the initramfs debug shell instead of looking for a rootfs
            DEV="$APORTS/device/testing/device-xiaomi-umi"
            sed -i 's|^\(deviceinfo_kernel_cmdline=".*\)"$|\1 pmos.debug-shell"|' "$DEV/deviceinfo"
            grep '^deviceinfo_kernel_cmdline' "$DEV/deviceinfo"
            sum="$(sha512sum "$DEV/deviceinfo" | cut -d' ' -f1)"
            sed -i "s|^[0-9a-f]\{128\}  deviceinfo\$|$sum  deviceinfo|" "$DEV/APKBUILD"
          fi

          WORK="$(pmbootstrap config work)"
          CACHE="$HOME/kernel-cache"
          if ls "$CACHE"/apk/linux-xiaomi-umi-*.apk >/dev/null 2>&1 \
              && [ -f "$CACHE/config_abuild/abuild.conf" ]; then
            echo "Cached kernel package found, restoring its signing key"
            sudo mkdir -p "$WORK/config_abuild" "$WORK/config_apk_keys"
            sudo cp -a "$CACHE"/config_abuild/. "$WORK/config_abuild/"
            sudo chown -R 12345:12345 "$WORK/config_abuild"
            sudo cp "$CACHE"/config_abuild/*.pub "$WORK/config_apk_keys/"
            echo "HAVE_KERNEL_CACHE=true" >> "$GITHUB_ENV"
          fi

          # the cache action restores files as the runner user; the build
          # runs as the chroot's "pmos" user
          if [ -d "$WORK/cache_ccache_aarch64" ]; then
            sudo chown -R 12345:12345 "$WORK/cache_ccache_aarch64"
            sudo du -sh "$WORK/cache_ccache_aarch64"
          fi

      - name: Build kernel, firmware and device packages
        run: |
          WORK="$(pmbootstrap config work)"
          CACHE="$HOME/kernel-cache"
          pmbootstrap --details-to-stdout -y build --arch aarch64 firmware-xiaomi-umi
          PKGS="$(dirname "$(sudo find "$WORK/packages" -name 'firmware-xiaomi-umi-2*.apk' | head -n1)")"
          echo "local package repository: $PKGS"

          if [ "${HAVE_KERNEL_CACHE:-}" = "true" ]; then
            sudo cp "$CACHE"/apk/linux-xiaomi-umi-*.apk "$PKGS/"
            sudo chown --reference="$PKGS/APKINDEX.tar.gz" "$PKGS"/linux-xiaomi-umi-*.apk
            pmbootstrap --details-to-stdout -y index
            REL="${PKGS#"$WORK/packages/"}"
            if pmbootstrap -y chroot -- sh -c "apk verify /mnt/pmbootstrap/packages/$REL/linux-xiaomi-umi-*.apk"; then
              echo "Using the cached kernel package"
            else
              echo "::warning::Cached kernel package is not trusted here, rebuilding the kernel"
              sudo rm -f "$PKGS"/linux-xiaomi-umi-*.apk
              pmbootstrap --details-to-stdout -y index
            fi
          fi

          pmbootstrap --details-to-stdout -y build --arch aarch64 linux-xiaomi-umi device-xiaomi-umi
          pmbootstrap -q chroot --user -- ccache -s || true

          # keep the kernel package and its signing key for the next run
          sudo rm -rf "$CACHE"
          mkdir -p "$CACHE/apk"
          sudo cp "$PKGS"/linux-xiaomi-umi-*.apk "$CACHE/apk/"
          sudo cp -a "$WORK/config_abuild" "$CACHE/config_abuild"
          sudo chown -R "$(id -u):$(id -g)" "$CACHE"
          ls -la "$CACHE/apk"

      - name: Build root filesystem and boot image
        run: |
          ADD=""
          if [ "$DEBUG_SHELL" = "true" ]; then
            ADD="--add postmarketos-mkinitfs-hook-debug-shell"
          fi
          if [ "$FULL_IMAGE" != "true" ]; then
            # only the chroot is needed to get boot.img
            ADD="$ADD --no-image"
          fi
          pmbootstrap --details-to-stdout -y install --password "$PASSWORD" $ADD

      - name: Collect boot files
        run: |
          WORK="$(pmbootstrap config work)"
          BOOT="$WORK/chroot_rootfs_$DEVICE/boot"
          sudo ls -la "$BOOT"
          mkdir out
          sudo cp "$BOOT/boot.img" out/boot.img
          sudo sh -c "cp $BOOT/vmlinuz* $BOOT/initramfs* out/ 2>/dev/null || true"
          sudo cp "$BOOT/dtbs/qcom/sm8250-xiaomi-umi.dtb" out/ 2>/dev/null || true
          if [ "$FULL_IMAGE" = "true" ]; then
            # sparse image (deviceinfo_flash_sparse), flashable with fastboot
            sudo cp "$WORK/chroot_native/home/pmos/rootfs/$DEVICE.img" "out/$DEVICE.img"
          fi
          sudo chown -R "$(id -u):$(id -g)" out
          (cd out && sha256sum * | tee SHA256SUMS)
          {
            echo "### $DEVICE (UI: $UI, debug shell: $DEBUG_SHELL, full image: $FULL_IMAGE)"
            echo '```'
            cat out/SHA256SUMS
            ls -la out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FULL_IMAGE == 'true' && format('xiaomi-umi-{0}', env.UI) || 'boot-xiaomi-umi' }}
          path: out/
          retention-days: 14

      - name: Prepare compiler cache for saving
        if: success() && env.HAVE_KERNEL_CACHE != 'true'
        run: sudo chmod -R a+rX "$HOME/.local/var/pmbootstrap/cache_ccache_aarch64" || true

      - name: Save compiler cache
        if: success() && env.HAVE_KERNEL_CACHE != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/var/pmbootstrap/cache_ccache_aarch64
          key: ccache-${{ github.run_id }}

      - name: Show the end of the pmbootstrap log on failure
        if: failure()
        run: |
          WORK="$(pmbootstrap config work 2>/dev/null || echo "$HOME/.local/var/pmbootstrap")"
          sudo tail -n 150 "$WORK/log.txt" || true
          # also as annotations, so the cause is visible without opening the log
          sudo grep -nE "error:|Error |ERROR|FAILED|undefined|No such file" "$WORK/log.txt" 2>/dev/null \
            | tail -n 8 | while IFS= read -r line; do echo "::error::${line}"; done || true
