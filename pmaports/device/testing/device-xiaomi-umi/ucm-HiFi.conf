# Xiaomi Mi 10 (umi): ADSP MultiMedia1 -> Tertiary MI2S -> two CS35L41 amps.
# LCV (0x42) drives the bottom loudspeaker, RCV (0x40) the top earpiece. Both
# play the same signal for now (the DSP only fills slot 0).

SectionVerb {
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		# Full analog (+20.5 dB) and digital (+12 dB) gain overdrive the
		# small speakers. +4.5 dB analog, 0 dB digital, no DRE.
		cset "name='LCV DRE Switch' 0"
		cset "name='RCV DRE Switch' 0"
		cset "name='LCV Analog PCM Volume' 4"
		cset "name='RCV Analog PCM Volume' 4"
		cset "name='LCV Digital PCM Volume' 817"
		cset "name='RCV Digital PCM Volume' 817"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
