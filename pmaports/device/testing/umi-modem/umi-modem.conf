# The modem must not start before its Sahara server is ready and its first
# stage firmware is linked: umi-modem.service loads mhi_pci_generic itself.
blacklist mhi_pci_generic

# This modem reports subsystem 17cb:010c, like the Foxconn T99W175 that
# boots from its own flash; tell the driver it is the flashless one.
options mhi_pci_generic sdx55_flashless=1
